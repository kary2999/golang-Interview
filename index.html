<!doctype html>
<!-- [skill: go-team-standards · dev-dna] 提供可离线运行的语义化刷题页面 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta
    name="description"
    content="无需安装、可离线使用的 Go 面试随机刷题卡片。"
  >
  <title>Go 面试随身练</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#question-text">跳到当前题目</a>

  <main id="app" class="app-shell">
    <header class="site-header">
      <div class="brand">
        <p class="brand-kicker">GOLANG INTERVIEW</p>
        <h1>Go 面试随身练</h1>
        <p class="brand-description">一次专注一道题，按自己的节奏复习。</p>
      </div>

      <div class="mode-switch" role="group" aria-label="选择复习模式">
        <button
          id="mode-all"
          class="mode-button"
          type="button"
          aria-pressed="true"
        >
          全部题目
        </button>
        <button
          id="mode-hard"
          class="mode-button"
          type="button"
          aria-pressed="false"
        >
          只看不会
        </button>
      </div>
    </header>

    <div
      id="storage-warning"
      class="notice notice-warning"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <div
      id="app-error"
      class="notice notice-error"
      role="alert"
      hidden
    ></div>

    <section class="study-status" aria-label="本轮学习进度">
      <div class="progress-copy">
        <span id="progress-text" class="progress-text">0 / 0</span>
        <span id="hard-count" class="hard-count" aria-live="polite">
          不会题 0
        </span>
      </div>
      <div
        id="progress-bar"
        class="progress-track"
        role="progressbar"
        aria-label="本轮学习进度"
        aria-valuemin="0"
        aria-valuemax="1"
        aria-valuenow="0"
        aria-valuetext="正在加载题库"
      >
        <span id="progress-fill" class="progress-fill"></span>
      </div>
      <button
        id="reshuffle-button"
        class="text-button"
        type="button"
        aria-label="重新随机排列本轮题目"
      >
        重新洗牌
      </button>
    </section>

    <section
      id="empty-state"
      class="empty-state"
      aria-live="polite"
      hidden
    >
      <span class="empty-icon" aria-hidden="true">✓</span>
      <h2>还没有标记“不会”的题目</h2>
      <p>切回“全部题目”，遇到需要复习的内容时点击“标记不会”。</p>
    </section>

    <article
      id="question-card"
      class="question-card"
      aria-labelledby="question-text"
    >
      <header class="question-meta">
        <p id="question-number" class="question-number">正在加载</p>
        <span id="source-badge" class="source-badge" hidden>补充整理</span>
      </header>

      <h2 id="question-text" class="question-text">题库加载中…</h2>

      <section
        id="answer-panel"
        class="answer-panel"
        aria-labelledby="answer-heading"
        aria-live="polite"
        hidden
      >
        <h3 id="answer-heading" class="answer-heading">参考答案</h3>
        <div id="answer-content" class="answer-content"></div>
      </section>

      <footer class="card-actions" aria-label="题目操作">
        <button
          id="previous-button"
          class="action-button action-secondary"
          type="button"
          aria-label="上一题"
        >
          <span aria-hidden="true">←</span>
          上一题
        </button>
        <button
          id="answer-button"
          class="action-button action-primary"
          type="button"
          aria-controls="answer-panel"
          aria-expanded="false"
        >
          显示答案
        </button>
        <button
          id="next-button"
          class="action-button action-secondary"
          type="button"
          aria-label="下一题"
        >
          下一题
          <span aria-hidden="true">→</span>
        </button>
      </footer>
    </article>

    <section
      id="review-actions"
      class="review-actions"
      aria-label="复习标记"
    >
      <button
        id="hard-button"
        class="hard-button"
        type="button"
        aria-pressed="false"
      >
        标记不会
      </button>
      <p class="keyboard-hint">
        快捷键：空格显示答案 · ← / → 切题 · J 标记不会
      </p>
    </section>
  </main>

  <div
    id="live-region"
    class="visually-hidden"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <script src="data/questions.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
